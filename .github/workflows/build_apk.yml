name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.hogarsabio --project-name viaje_en_silencio .

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: viaje-en-silencio-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk viaje-en-silencio.apk
          gh release create "v1.0.${{ github.run_number }}" viaje-en-silencio.apk \
            --title "Viaje en Silencio v1.0.${{ github.run_number }}" \
            --notes "APK de prueba (firmado con clave de depuración)."
